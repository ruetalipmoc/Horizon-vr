[package]
name = "horizon-xr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenXR for Horizon: Quest on Android, desktop headsets on Linux"
publish = false

[dependencies]
log = "0.4"
glam = "0.30"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
ash = "0.38"

[lints]
workspace = true
