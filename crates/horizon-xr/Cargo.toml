[package]
name = "horizon-xr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "VR on standalone headsets (Quest): an OpenXR session the renderer draws each eye into"
publish = false

[dependencies]
log = "0.4"
glam = "0.30"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
ash = "0.38"

[lints]
workspace = true
